<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchMind | Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="archmind.css">
</head>
<body class="app-page">

    <!-- Shell filled by archmind.js -->
    <div id="profileShell"></div>

    <!-- Edit Post Modal (shared, populated by editPost()) -->
    <div class="modal-overlay" id="editPostModal">
        <div class="modal-box">
            <h3>Edit Project</h3>

            <label class="field-label">Title</label>
            <input type="text" id="epTitle" class="form-control" placeholder="Project title">

            <label class="field-label">Description</label>
            <textarea id="epDesc" class="form-control" rows="4" placeholder="Project description"></textarea>

            <label class="field-label">Budget</label>
            <input type="text" id="epBudget" class="form-control" placeholder="e.g. Rs.50,000 – Rs.80,000">

            <label class="field-label">Replace Image (optional)</label>
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
                <img id="epImgPreview" src="" alt="preview"
                     style="width:70px;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--border);">
                <div>
                    <input type="file" id="epFileInput" accept="image/*" style="display:none"
                           onchange="previewEditImage(event)">
                    <button class="btn-outline" style="padding:8px 14px;font-size:0.8rem;"
                            onclick="document.getElementById('epFileInput').click()">Choose Image</button>
                </div>
            </div>

            <input type="hidden" id="epPostId">

            <div class="modal-actions">
                <button class="btn-save"    onclick="saveEditedPost()">Save Changes</button>
                <button class="btn-outline" onclick="closeEditModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="archmind.js"></script>

    <!-- Payment workflow modal (injected by archmind.js) -->
    <div id="payWorkflowModal" class="modal-overlay"></div>

    <script>
        // After archmind.js renders the profile shell, wire up the request dashboard sections
        window.addEventListener('DOMContentLoaded', () => {
            // Give renderProfile() time to inject the DOM, then populate request sections
            setTimeout(() => {
                const sentEl     = document.getElementById('sentRequestsBody');
                const incomingEl = document.getElementById('incomingRequestsBody');
                if (sentEl)     renderSentRequests(sentEl);
                if (incomingEl) renderIncomingRequests(incomingEl);
            }, 80);
        });
    </script>
</body>
</html>
